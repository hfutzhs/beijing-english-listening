  // Mouse drag for desktop
  function handleMouseDown(e) {
    swipeRef.current = { startX: e.clientX, startY: e.clientY, dx: 0, dy: 0 };
  }
  function handleMouseMove(e) {
    if (swipeRef.current.startX) {
      swipeRef.current.dx = e.clientX - swipeRef.current.startX;
      swipeRef.current.dy = e.clientY - swipeRef.current.startY;
    }
  }
  function handleMouseUp() {
    doSwipeEnd();
  }
  function doSwipeEnd() {
    var cur = swipeRef.current;
    if (Math.abs(cur.dx) > SWIPE_THRESHOLD && Math.abs(cur.dx) > Math.abs(cur.dy) + 10) {
      if (cur.dx < 0 && currentIndex < totalWords - 1) {
        handleNext();
      } else if (cur.dx > 0 && currentIndex > 0) {
        handlePrev();
      }
    }
    swipeRef.current = { startX: 0, startY: 0, dx: 0, dy: 0 };
  }

  // Completed screen
  if (completed) {
    var accuracy = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;
    return (
      <div className="fit-screen flex items-center justify-center" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
        <div style={{ width: contentWidth, margin: '0 auto', padding: '24px' }}>
          <div className="rounded-3xl p-8 text-center" style={{ background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(12px)', border: '1px solid rgba(99,102,241,0.10)', boxShadow: '0 4px 20px rgba(99,102,241,0.08)' }}>
            <div className="rounded-full flex items-center justify-center mx-auto mb-4" style={{ width: 72, height: 72, background: accuracy >= 80 ? '#10B98122' : accuracy >= 60 ? '#F59E0B22' : '#EF444422' }}>
              <Award size={32} color={accuracy >= 80 ? '#10B981' : accuracy >= 60 ? '#F59E0B' : '#EF4444'} />
            </div>
            <span className="block text-2xl font-extrabold mb-2" style={{ color: '#1E293B' }}>今日练习完成</span>
            <span className="block text-sm mb-6" style={{ color: '#64748B' }}>{todayKey}</span>
            <div className="flex justify-center gap-6 mb-4">
              <div className="text-center">
                <span className="block text-3xl font-extrabold" style={{ color: '#10B981' }}>{correctCount}</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>答对</span>
              </div>
              <div className="text-center">
                <span className="block text-3xl font-extrabold" style={{ color: '#EF4444' }}>{wrongCount}</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>答错</span>
              </div>
              <div className="text-center">
                <span className="block text-3xl font-extrabold" style={{ color: '#6366F1' }}>{accuracy}%</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>正确率</span>
              </div>
            </div>
            <div className="flex justify-center gap-6 mb-6">
              <div className="text-center">
                <span className="block text-2xl font-bold" style={{ color: '#4338CA' }}>{vocabBankTotal}</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>词库总数</span>
              </div>
              <div className="text-center">
                <span className="block text-2xl font-bold" style={{ color: '#4338CA' }}>{cumulativeSlain}</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>累计已斩</span>
              </div>
              <div className="text-center">
                <span className="block text-2xl font-bold" style={{ color: '#4338CA' }}>{cumulativeAttempted}</span>
                <span className="block text-xs mt-1" style={{ color: '#64748B' }}>累计练习</span>
              </div>
            </div>
            <button onClick={handleRestart} className="w-full rounded-xl py-3.5 font-bold text-white transition-all active:scale-[0.98]"
              style={{ background: 'linear-gradient(135deg, #4338CA, #6366F1)', boxShadow: '0 4px 12px rgba(99,102,241,0.25)' }}>
              再练一组
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (!currentWord) {
    return (
      <div className="fit-screen flex items-center justify-center" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
        <div className="text-center">
          <p style={{ color: '#64748B' }}>暂无单词可练习</p>
          <button onClick={handleRestart} className="mt-4 rounded-xl px-6 py-2.5 font-bold text-white" style={{ background: 'linear-gradient(135deg, #4338CA, #6366F1)' }}>重新生成</button>
        </div>
      </div>
    );
  }

  var progressPercent = Math.round((answeredCount / totalWords) * 100);
  var isAnswered = selectedAnswer !== null;
  var isCorrectAnswer = isAnswered && selectedAnswer === currentWord.zh;

  return (
    <div className="fit-screen" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
      <div style={{ width: contentWidth, margin: '0 auto' }}>
        {/* Header */}
        <div className="px-5 pt-6 pb-4 tech-grid" style={{ background: 'linear-gradient(135deg, #4338CA, #6366F1)', boxShadow: '0 4px 20px rgba(99,102,241,0.08)', borderBottomLeftRadius: 24, borderBottomRightRadius: 24 }}>
          <div className="flex items-center">
            <div className="rounded-xl flex items-center justify-center" style={{ width: 40, height: 40, backgroundColor: 'rgba(255,255,255,0.12)' }}>
              <BookMarked size={18} color="#FFFFFF" />
            </div>
            <div className="ml-3 flex-1">
              <span className="text-white text-xl font-extrabold block">百词斩</span>
              <span className="text-white/90 text-xs block">每日单词学习 · 第 {currentIndex + 1} / {totalWords} 题</span>
            </div>
            <button onClick={function() { setShowSettings(true); }} className="rounded-lg flex items-center justify-center"
              style={{ width: 36, height: 36, backgroundColor: 'rgba(255,255,255,0.12)' }}>
              <Settings size={16} color="#FFFFFF" />
            </button>
          </div>
          {/* Progress bar */}
          <div className="mt-3 rounded-full overflow-hidden" style={{ backgroundColor: 'rgba(255,255,255,0.15)', height: 6 }}>
            <div style={{ width: progressPercent + '%', height: '100%', background: 'linear-gradient(90deg, #FFFFFF, #C7D2FE)', borderRadius: 3, transition: 'width 0.3s' }} />
          </div>
          <div className="flex items-center mt-2">
            <span className="text-white/90 text-xs">词库 {vocabBankTotal}</span>
            <span className="text-white/90 text-xs ml-3">已斩 {cumulativeSlain}</span>
            <span className="text-white/90 text-xs ml-3">正确 {correctCount}</span>
            <span className="text-white/90 text-xs ml-3">错误 {wrongCount}</span>
            <span className="text-white/90 text-xs ml-3">每日 {dailyCount} 词</span>
          </div>
        </div>

        {/* Word card with swipe */}
        <div className="scroll-area" style={{ paddingLeft: contentPadding, paddingRight: contentPadding, paddingTop: 10, paddingBottom: 60 }}>
          <div
            ref={cardRef}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            className="rounded-3xl p-5 select-none"
            style={{
              background: 'rgba(255,255,255,0.95)',
              backdropFilter: 'blur(12px)',
              border: '1px solid rgba(99,102,241,0.10)',
              boxShadow: '0 4px 20px rgba(99,102,241,0.06)',
              cursor: 'grab',
              userSelect: 'none',
              WebkitUserSelect: 'none',
              touchAction: 'pan-y',
            }}
          >
            {/* English word */}
            <div className="text-center py-5">
              <button onClick={speakWord}
                className="rounded-full flex items-center justify-center mx-auto mb-4 active:scale-95 transition-transform"
                style={{ width: 56, height: 56, background: 'linear-gradient(135deg, #4338CA, #6366F1)', boxShadow: '0 4px 12px rgba(99,102,241,0.25)' }}>
                <Volume2 size={22} color="#FFFFFF" />
              </button>
              <div className="flex items-center justify-center gap-2">
                <span className="text-3xl font-extrabold" style={{ color: '#1E293B', fontFamily: 'Inter, sans-serif' }}>{currentWord.en}</span>
                <button onClick={speakWord} className="ml-1 active:scale-90 transition-transform" style={{ padding: 4 }}>
                  <Volume2 size={18} color="#6366F1" />
                </button>
              </div>
              {currentWord.ph && (
                <span className="block text-base mt-2" style={{ color: '#6366F1', fontFamily: 'Inter, sans-serif', fontWeight: 500 }}>{currentWord.ph}</span>
              )}
              <span className="block text-sm mt-2" style={{ color: '#94A3B8' }}>选择正确的中文释义</span>
            </div>

            {/* Options */}
            <div className="flex flex-col" style={{ gap: 10 }}>
              {optionsForWord.map(function(option, idx) {
                var isThisCorrect = option === currentWord.zh;
                var isThisSelected = selectedAnswer === option;
                var bgColor = 'rgba(255,255,255,0.95)';
                var borderColor = 'rgba(99,102,241,0.10)';
                var textColor = '#1E293B';
                var iconEl = null;
                if (isAnswered) {
                  if (isThisCorrect) {
                    bgColor = '#10B98115'; borderColor = '#10B981'; textColor = '#10B981';
                    iconEl = <Check size={20} color="#10B981" />;
                  } else if (isThisSelected) {
                    bgColor = '#EF444415'; borderColor = '#EF4444'; textColor = '#EF4444';
                    iconEl = <XIcon size={20} color="#EF4444" />;
                  }
                }
                return (
                  <button key={idx} onClick={function() { handleAnswer(option); }}
                    disabled={isAnswered}
                    className="rounded-xl p-4 flex items-center transition-all active:scale-[0.98]"
                    style={{ background: bgColor, border: '2px solid ' + borderColor, opacity: isAnswered && !isThisCorrect && !isThisSelected ? 0.5 : 1 }}>
                    <span className="rounded-lg flex items-center justify-center flex-shrink-0"
                      style={{ width: 32, height: 32, backgroundColor: borderColor, color: '#FFFFFF', fontSize: 14, fontWeight: 700 }}>
                      {String.fromCharCode(65 + idx)}
                    </span>
                    <span className="ml-3 text-base font-medium" style={{ color: textColor, flex: 1, textAlign: 'left' }}>{option}</span>
                    {iconEl}
                  </button>
                );
              })}
            </div>

            {/* Feedback */}
            {isAnswered && (
              <div className="mt-4 rounded-xl p-3 flex items-center" style={{ background: isCorrectAnswer ? '#10B98110' : '#EF444410' }}>
                {isCorrectAnswer ? <Check size={18} color="#10B981" /> : <XIcon size={18} color="#EF4444" />}
                <span className="ml-2 text-sm font-medium" style={{ color: isCorrectAnswer ? '#10B981' : '#EF4444' }}>
                  {isCorrectAnswer ? '回答正确！' : '回答错误，正确答案是：' + currentWord.zh}
                </span>
              </div>
            )}
          </div>

          {/* Navigation: swipe + buttons */}
          <div className="flex items-center justify-center mt-4" style={{ gap: 16 }}>
            <button onClick={handlePrev} disabled={currentIndex <= 0}
              className="rounded-xl flex items-center justify-center transition-all active:scale-95"
              style={{ width: 44, height: 44, background: currentIndex > 0 ? 'rgba(99,102,241,0.10)' : 'rgba(99,102,241,0.04)', border: '1px solid rgba(99,102,241,0.10)' }}>
              <ChevronLeft size={20} color={currentIndex > 0 ? '#6366F1' : '#CBD5E1'} />
            </button>
            <span className="text-xs" style={{ color: '#94A3B8' }}>左滑/右滑或点击切换</span>
            <button onClick={handleNext} disabled={currentIndex >= totalWords - 1}
              className="rounded-xl flex items-center justify-center transition-all active:scale-95"
              style={{ width: 44, height: 44, background: currentIndex < totalWords - 1 ? 'rgba(99,102,241,0.10)' : 'rgba(99,102,241,0.04)', border: '1px solid rgba(99,102,241,0.10)' }}>
              <ChevronRight size={20} color={currentIndex < totalWords - 1 ? '#6366F1' : '#CBD5E1'} />
            </button>
          </div>
        </div>
      </div>

      {/* Settings modal */}
      {showSettings && (
        <div onClick={function() { setShowSettings(false); }}
          className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.4)' }}>
          <div onClick={function(e) { e.stopPropagation(); }}
            className="rounded-2xl p-6 mx-6" style={{ width: '90%', maxWidth: 360, background: '#FFFFFF', boxShadow: '0 8px 32px rgba(0,0,0,0.15)' }}>
            <div className="flex items-center mb-4">
              <Settings size={20} color="#6366F1" />
              <span className="ml-2 text-lg font-bold" style={{ color: '#1E293B' }}>每日单词数量</span>
            </div>
            <p className="text-sm mb-4" style={{ color: '#64748B' }}>设置每天学习的单词数量，修改后重新开始今日练习。</p>
            <div className="flex flex-wrap gap-2 mb-3">
              {[20, 50, 100, 150, 200, 300, 500].map(function(n) {
                return (
                  <button key={n} onClick={function() { handleSaveSettings(n); }}
                    className="rounded-xl py-2.5 px-4 font-bold transition-all"
                    style={{ background: n === dailyCount ? 'linear-gradient(135deg, #4338CA, #6366F1)' : 'rgba(99,102,241,0.06)',
                      color: n === dailyCount ? '#FFFFFF' : '#6366F1', border: n === dailyCount ? 'none' : '1px solid rgba(99,102,241,0.15)' }}>
                    {n}
                  </button>
                );
              })}
            </div>
            <div className="flex items-center gap-2 mb-6">
              <input id="vocab-custom-count" type="number" min="1" defaultValue={dailyCount}
                className="rounded-xl py-2.5 px-4 flex-1 font-bold"
                style={{ border: '1px solid rgba(99,102,241,0.20)', color: '#1E293B', fontSize: 16, outline: 'none' }}
                placeholder="自定义数量" />
              <button onClick={function() {
                  var input = document.getElementById('vocab-custom-count');
                  var n = parseInt(input.value);
                  if (n && n > 0) handleSaveSettings(n);
                }}
                className="rounded-xl py-2.5 px-5 font-bold text-white whitespace-nowrap"
                style={{ background: 'linear-gradient(135deg, #4338CA, #6366F1)' }}>
                确定
              </button>
            </div>
            <button onClick={function() { setShowSettings(false); }}
              className="w-full rounded-xl py-3 font-medium" style={{ background: 'rgba(99,102,241,0.06)', color: '#64748B' }}>
              取消
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// === App ===
function App() {
  var route = useHashRoute();
  var parsed = parseRoute(route);
  var path = parsed.path, params = parsed.params;

  var FULLSCREEN_ROUTES = ['/practice-answer', '/exam-flow', '/scoring-guide', '/history-detail'];
  var hideTabBar = FULLSCREEN_ROUTES.some(function(r) { return path.startsWith(r); });

  var page = null;
  if (path === '/' || path === '' || path === '/training') {
    page = <TrainingHome />;
  } else if (path === '/vocabulary') {
    page = <VocabularyTraining />;
  } else if (path.indexOf('/practice/') === 0) {
    var ptype = path.replace('/practice/', '');
    page = <PracticeList type={ptype} />;
  } else if (path === '/practice-answer') {
    page = <PracticeAnswer questionId={Number(params.get('questionId'))} qType={params.get('type') || 'listen_choose'} />;
  } else if (path === '/exam') {
    page = <ExamMock />;
  } else if (path === '/exam-flow') {
    page = <ExamFlow paperId={Number(params.get('paperId'))} />;
  } else if (path === '/history') {
    page = <History />;
  } else if (path === '/history-detail') {
    page = <HistoryDetail recordId={Number(params.get('id'))} />;
  } else if (path === '/scoring-guide') {
    page = <ScoringGuide type={params.get('type') || ''} />;
  } else {
    page = <TrainingHome />;
  }

  return (
    <div style={{ minHeight: '100vh', overflow: 'visible', paddingBottom: hideTabBar ? 0 : 56 }}>
      {page}
      {!hideTabBar && <TabBar />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
function transformAppCode() {
  if (typeof Babel === 'undefined') {
    setTimeout(transformAppCode, 50);
    return;
  }
  var src = document.getElementById('app-source').textContent;
  try {
    var transformed = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    var script = document.createElement('script');
    script.textContent = transformed;
    document.body.appendChild(script);
  } catch(e) {
    console.error('Babel transform error:', e);
    var root = document.getElementById('root');
    if (root) root.innerHTML = '<div style="padding:20px;color:#EF4444;font-family:sans-serif">应用加载失败: ' + e.message + '</div>';
  }
}
document.addEventListener('DOMContentLoaded', transformAppCode);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SW_UPDATED') { window.location.reload(); }
      if (e.data && e.data.type === 'VERSION_MISMATCH') { window.location.reload(); }
    });
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function(reg) {
      // Force-check for SW update on every page load (bypasses 24h browser throttle)
      reg.update();
      // Also check every 60 seconds in case the page stays open
      setInterval(function() { reg.update(); }, 60000);
      // When a new SW is found and installed, tell it to skipWaiting immediately
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
           if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
               // For existing pages with an old controller, skipWaiting + reload
               newWorker.postMessage({ type: 'SKIP_WAITING' });
             }
           });
         }
       });
      // If no controller yet (first visit or SW was unregistered), claim immediately
      if (!navigator.serviceWorker.controller && reg.active) {
        window.location.reload();
      }
      // Send page version to SW for version-mismatch detection
      if (navigator.serviceWorker.controller) {
        var channel = new MessageChannel();
     navigator.serviceWorker.controller.postMessage({ type: 'CHECK_VERSION', version: 'v33' }, [channel.port2]);
        channel.port1.onmessage = function(e) {
          if (e.data && e.data.mismatch) { window.location.reload(); }
        };
      }
    }).catch(function(e) { console.log('SW registration failed:', e); });
  });
}
</script>
