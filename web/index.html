var lrSeeds = [
  { topic: "A School Trip to the Museum", intro: "Last Friday, the students went on a school trip. Here is some information about their visit.", script: "Last Friday, Class 3 went on a school trip to the Science Museum. They went there by school bus. The museum is in the city center. They arrived at nine o'clock in the morning. First, they watched a movie about space in the planetarium. Then, they visited the robot exhibition on the second floor. After lunch, they went to the gift shop and bought some souvenirs. They returned to school at three o'clock in the afternoon. Everyone had a great time.", points: [{ label: "When", answer: "Last Friday" }, { label: "Where", answer: "The Science Museum" }, { label: "Transportation", answer: "By school bus" }, { label: "First activity", answer: "Watched a movie about space" }, { label: "Second activity", answer: "Visited the robot exhibition" }, { label: "Return time", answer: "Three o'clock in the afternoon" }] },
  { topic: "A Birthday Party", intro: "Last Saturday, Jenny had a birthday party. Here is some information about the party.", script: "Last Saturday, Jenny celebrated her fourteenth birthday. She invited ten friends to her party. The party started at six o'clock in the evening. They had the party in her garden. Jenny's mother made a big chocolate cake. They ate pizza, fruit, and ice cream. After dinner, they played games and sang songs. Jenny got many presents. Her best friend gave her a diary. Everyone had a wonderful time.", points: [{ label: "When", answer: "Last Saturday" }, { label: "Whose birthday", answer: "Jenny's fourteenth birthday" }, { label: "How many guests", answer: "Ten friends" }, { label: "Where", answer: "In her garden" }, { label: "Food", answer: "Chocolate cake, pizza, fruit, and ice cream" }, { label: "Best present", answer: "A diary from her best friend" }] },
  { topic: "A Day at the Beach", intro: "Last Sunday, Tom and his family went to the beach. Here is some information about their day.", script: "Last Sunday, Tom went to the beach with his parents and sister. They drove there by car. It took about two hours. They arrived at ten in the morning. The weather was sunny and warm. Tom and his sister swam in the sea. Their father read a book under an umbrella. Their mother collected seashells. At noon, they had a picnic on the sand. They ate sandwiches and drank juice. They left the beach at five in the afternoon. It was a perfect day.", points: [{ label: "When", answer: "Last Sunday" }, { label: "Who", answer: "Tom, his parents, and his sister" }, { label: "Transportation", answer: "By car" }, { label: "Weather", answer: "Sunny and warm" }, { label: "Activities", answer: "Swimming, reading, and collecting seashells" }, { label: "Lunch", answer: "Sandwiches and juice" }] },
  { topic: "My New School", intro: "Amy just started at a new school. Here is some information about her school.", script: "Amy started at a new school this September. The school is called Sunshine Middle School. It is near her home, so she walks to school every day. It takes about ten minutes. Her school has three teaching buildings and a big library. There are forty classrooms. Amy's class has thirty-five students. Her favorite teacher is Miss Wang, who teaches English. Amy has made many new friends. She joins the school choir and practices singing every Wednesday afternoon. She likes her new school very much.", points: [{ label: "School name", answer: "Sunshine Middle School" }, { label: "How she goes", answer: "On foot, about ten minutes" }, { label: "Buildings", answer: "Three teaching buildings and a big library" }, { label: "Class size", answer: "Thirty-five students" }, { label: "Favorite teacher", answer: "Miss Wang (English teacher)" }, { label: "Club", answer: "The school choir, every Wednesday afternoon" }] },
  { topic: "A Camping Trip", intro: "Last weekend, a group of friends went camping. Here is some information about their trip.", script: "Last weekend, Mike and his three friends went camping at Forest Park. They rode their bicycles there. It took about forty minutes. They set up their tents near a small lake. In the afternoon, they went hiking in the forest and saw some beautiful birds. In the evening, they made a campfire and cooked hot dogs. They also told stories and sang songs around the fire. At night, they slept in their tents. The next morning, they packed up and went home. It was an exciting adventure.", points: [{ label: "When", answer: "Last weekend" }, { label: "Who", answer: "Mike and three friends" }, { label: "Where", answer: "Forest Park, near a small lake" }, { label: "Transportation", answer: "By bicycle, about forty minutes" }, { label: "Afternoon activity", answer: "Went hiking and saw beautiful birds" }, { label: "Evening activity", answer: "Made a campfire, cooked hot dogs, told stories, and sang songs" }] },
  { topic: "A Visit to the Zoo", intro: "Last Saturday, a class visited the zoo. Here is some information about their visit.", script: "Last Saturday, Class 5 visited the City Zoo. They went there by subway. They arrived at half past nine. First, they went to see the pandas. The pandas were eating bamboo. Then, they visited the monkeys. The monkeys were very playful. After that, they watched the elephant show. The elephants could draw pictures with their trunks. At lunchtime, they ate near the lake. They also visited the aquarium and saw many colorful fish. They left the zoo at four o'clock. It was a fun day.", points: [{ label: "When", answer: "Last Saturday" }, { label: "Where", answer: "The City Zoo" }, { label: "Transportation", answer: "By subway" }, { label: "First animals", answer: "Pandas eating bamboo" }, { label: "Show", answer: "The elephant show, elephants drawing pictures" }, { label: "Last visit", answer: "The aquarium with colorful fish" }] },
  { topic: "A Sports Meet", intro: "Last week, the school held a sports meet. Here is some information about the event.", script: "Last Thursday and Friday, our school held the annual sports meet. It was on the school playground. There were many events, including running, long jump, and relay races. Tom won first place in the 100-meter race. Lily came second in the long jump. Class 3 won the relay race. Many students and teachers came to watch and cheer. The principal gave medals to the winners. In the end, Class 3 got the most points and won the team championship. Everyone was excited and happy.", points: [{ label: "When", answer: "Last Thursday and Friday" }, { label: "Where", answer: "On the school playground" }, { label: "Events", answer: "Running, long jump, and relay races" }, { label: "100-meter winner", answer: "Tom, first place" }, { label: "Long jump", answer: "Lily, second place" }, { label: "Team champion", answer: "Class 3, the most points" }] },
  { topic: "My Hometown", intro: "Here is some information about a student's hometown.", script: "My hometown is a small city in the south of China. It has a population of about 500,000 people. The weather is warm and humid all year round. There are many beautiful parks and a famous lake in the center of the city. The lake is called Green Lake. People like to walk around it in the evening. The city is famous for its delicious food, especially the rice noodles. Every spring, there is a flower festival. Many tourists come to visit. I love my hometown very much.", points: [{ label: "Location", answer: "A small city in the south of China" }, { label: "Population", answer: "About 500,000 people" }, { label: "Weather", answer: "Warm and humid all year round" }, { label: "Famous place", answer: "Green Lake in the city center" }, { label: "Famous food", answer: "Rice noodles" }, { label: "Festival", answer: "A flower festival every spring" }] },
  { topic: "A Cooking Class", intro: "Last Wednesday, some students had a cooking class. Here is some information about the class.", script: "Last Wednesday, twenty students attended a cooking class at the community center. The teacher was Chef Wang. They learned to make Chinese dumplings. First, they prepared the dough with flour and water. Then, they made the filling with pork and cabbage. After that, they wrapped the dumplings. It was a bit difficult at first, but everyone got better with practice. Finally, they boiled the dumplings and ate them together. The dumplings were delicious. Everyone had fun and learned a new skill.", points: [{ label: "When", answer: "Last Wednesday" }, { label: "Where", answer: "At the community center" }, { label: "Teacher", answer: "Chef Wang" }, { label: "What they made", answer: "Chinese dumplings" }, { label: "Steps", answer: "Prepared dough, made filling, wrapped, and boiled" }, { label: "Filling", answer: "Pork and cabbage" }] },
  { topic: "A Visit to the Farm", intro: "Last weekend, a family visited a farm. Here is some information about their visit.", script: "Last weekend, Lucy and her family visited a farm in the countryside. They drove there by car. It took about one hour. The farm was very big. It had cows, sheep, chickens, and ducks. Lucy fed the sheep and collected eggs from the chickens. Her father milked a cow. Her mother picked fresh vegetables from the garden. At lunchtime, they had a farm meal with fresh eggs and vegetables. In the afternoon, they went horse riding. They left the farm at four o'clock. It was a wonderful experience.", points: [{ label: "When", answer: "Last weekend" }, { label: "Where", answer: "A farm in the countryside" }, { label: "Animals", answer: "Cows, sheep, chickens, and ducks" }, { label: "Lucy's activities", answer: "Fed the sheep and collected eggs" }, { label: "Father's activity", answer: "Milked a cow" }, { label: "Afternoon", answer: "Went horse riding" }] },
  { topic: "A Spring Festival", intro: "Here is some information about how a family celebrated Spring Festival.", script: "This year, our family celebrated Spring Festival at my grandparents' house. We went there by train on New Year's Eve. My grandmother made a big dinner. We had fish, dumplings, and many other delicious dishes. After dinner, we watched the Spring Festival Gala on TV. At midnight, we set off fireworks. The next morning, I received red envelopes from my grandparents and parents. In the afternoon, we visited our relatives. I played with my cousins. We had a great time together. Spring Festival is my favorite holiday.", points: [{ label: "Where", answer: "At grandparents' house" }, { label: "Transportation", answer: "By train on New Year's Eve" }, { label: "Dinner", answer: "Fish, dumplings, and other dishes" }, { label: "After dinner", answer: "Watched the Spring Festival Gala and set off fireworks" }, { label: "Morning", answer: "Received red envelopes" }, { label: "Afternoon", answer: "Visited relatives and played with cousins" }] },
  { topic: "A School Art Festival", intro: "Last Friday, the school held an art festival. Here is some information about the event.", script: "Last Friday, our school held the annual art festival in the school hall. It started at two o'clock in the afternoon. There were many performances. First, the school band played three songs. Then, some students performed a dance. After that, a group of students acted in a short play about friendship. The most popular performance was a magic show by Mr. Li, the math teacher. There was also an art exhibition in the lobby. Students showed their paintings and photos. The festival ended at five o'clock. Everyone enjoyed it very much.", points: [{ label: "When", answer: "Last Friday, from 2 PM to 5 PM" }, { label: "Where", answer: "In the school hall" }, { label: "First performance", answer: "The school band played three songs" }, { label: "Most popular", answer: "A magic show by Mr. Li" }, { label: "Other performances", answer: "A dance and a short play about friendship" }, { label: "Exhibition", answer: "Paintings and photos in the lobby" }] },
  { topic: "A Trip to the Mountains", intro: "Last summer, a family went on a trip to the mountains. Here is some information about their trip.", script: "Last summer, David and his family went to Mount Tai for a trip. They went there by high-speed train. It took about three hours. They arrived at the foot of the mountain at noon. They started climbing at one o'clock. It took them four hours to reach the top. They stayed overnight at a hotel on the mountain. The next morning, they woke up early to watch the sunrise. It was beautiful. After breakfast, they took a cable car down. It was a tiring but unforgettable trip.", points: [{ label: "When", answer: "Last summer" }, { label: "Where", answer: "Mount Tai" }, { label: "Transportation", answer: "By high-speed train, three hours" }, { label: "Climbing", answer: "Started at 1 PM, took four hours to reach the top" }, { label: "Overnight", answer: "Stayed at a hotel on the mountain" }, { label: "Highlight", answer: "Watched the sunrise the next morning" }] },

  { topic: "A Volunteer Experience", intro: "Last weekend, some students did volunteer work. Here is some information about their experience.", script: "Last Saturday, ten students from our class went to the Sunshine Nursing Home. They went there by bus at eight o'clock in the morning. First, they cleaned the rooms and the garden. Then, they talked with the elderly people and listened to their stories. Some students performed songs and dances. After that, they helped serve lunch. One student, Tom, cut hair for the elderly. They stayed there for about four hours. The elderly people were very happy. The students felt proud and learned a lot from the experience.", points: [{ label: "When", answer: "Last Saturday, from 8 AM" }, { label: "Where", answer: "Sunshine Nursing Home" }, { label: "Transportation", answer: "By bus" }, { label: "First activity", answer: "Cleaned rooms and the garden" }, { label: "Second activity", answer: "Talked with elderly and performed songs and dances" }, { label: "Special", answer: "Tom cut hair for the elderly" }] },

function normalize(text) {
  return text.toLowerCase().trim().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function tokenize(text) {
  return normalize(text).split(' ').filter(function(w) { return w.length > 0; });
}
function levenshtein(a, b) {
  var m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  var dp = [];
  for (var i = 0; i <= m; i++) { dp.push(new Array(n + 1).fill(0)); dp[i][0] = i; }
  for (var j = 0; j <= n; j++) dp[0][j] = j;
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      var cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}
function wordSimilarity(text1, text2) {
  var t1 = new Set(tokenize(text1));
  var t2 = new Set(tokenize(text2));
  if (t1.size === 0 && t2.size === 0) return 1;
  if (t1.size === 0 || t2.size === 0) return 0;
  var intersection = 0;
  t1.forEach(function(t) { if (t2.has(t)) intersection++; });
  return intersection / (t1.size + t2.size - intersection);
}
function charSimilarity(text1, text2) {
  var s1 = normalize(text1), s2 = normalize(text2);
  if (s1.length === 0 && s2.length === 0) return 1;
  if (s1.length === 0 || s2.length === 0) return 0;
  return 1 - levenshtein(s1, s2) / Math.max(s1.length, s2.length);
}
function matchKeywords(transcript, keywords) {
  var normalized = normalize(transcript);
  var matched = [], missed = [];
  for (var i = 0; i < keywords.length; i++) {
    var nkw = normalize(keywords[i]);
    if (nkw && normalized.includes(nkw)) matched.push(keywords[i]);
    else missed.push(keywords[i]);
  }
  return { matched: matched, missed: missed };
}
function scoreListenChoose(selectedAnswer, correctAnswer, maxScore) {

function scoreListenAnswer(question, sampleAnswer, keywords, transcript, maxScore) {

        suggestions: '请仔细听录音后，尝试用完整的句子回答问题。', sampleAnswer: sampleAnswer } };

  if (keywordRatio >= 0.8 || similarity >= 0.7) score = maxScore;
  else if (keywordRatio >= 0.5 || similarity >= 0.4) score = Math.round(maxScore * 0.7 * 10) / 10;
  else if (keywordRatio >= 0.3 || similarity >= 0.2) score = Math.round(maxScore * 0.4 * 10) / 10;

    : '学生回答中未匹配到关键词。参考答案关键词为：' + keywords.join('、') + '。';

};
var SECTION_ORDER = ['listen_choose', 'listen_answer', 'listen_retell', 'read_aloud'];

function ExamFlow(props) {
  var paperId = props.paperId;
  var deviceId = useDeviceId();

  var lState = useState(true), loading = lState[0], setLoading = lState[1];
  var ciState = useState(0), currentIdx = ciState[0], setCurrentIdx = ciState[1];

        var sa = SECTION_ORDER.indexOf(a.type);
        var sb = SECTION_ORDER.indexOf(b.type);
        if (sa !== sb) return sa - sb;
        return a.id - b.id;

      setAllQuestions(qs);

  }, [paperId]);

  useEffect(function() { loadData(); }, [loadData]);

  var flatQuestions = useMemo(function() { return allQuestions; }, [allQuestions]);

      map[q.type].push(q);

  var currentType = currentQuestion ? currentQuestion.type : null;
  var currentSectionConfig = currentType ? SECTION_CONFIG[currentType] : null;

  useEffect(function() {
    if (currentQuestion) {
      var ans = answers[currentQuestion.id];

    if (transcript) setTextInput(transcript);
    if (currentQuestion) {

        updated[currentQuestion.id] = Object.assign({}, existing, {

            <span className="text-xs" style={{ color: scoreColor + '99' }}>/ {ms}</span>
          </div>
          <span className="text-stone-300 text-sm mt-3 block">{HD_TYPE_LABEL[typeKey] || record.question_type} · {isPass ? '及格' : '不及格'}</span>
          <span className="text-stone-300 text-xs mt-1 block">{record.created_at ? new Date(record.created_at).toLocaleString('zh-CN') : ''}</span>
        </div>

        {record.question_title && (
          <div className="rounded-2xl p-5 mt-4" style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.14)', boxShadow: '0 4px 24px rgba(99,102,241,0.06)' }}>
            <span className="text-stone-300 text-xs font-bold block mb-1">题目</span>
            <span className="text-slate-100 text-sm font-medium">{record.question_title}</span>
          </div>
        )}

        {record.transcription && (
          <ResultCard icon={FileText} label="语音转写" color={typeColor}>
            <span className="text-stone-100 text-sm leading-6">{record.transcription}</span>
          </ResultCard>
        )}

        {analysisText && (
          <ResultCard icon={BarChart3} label="评分分析" color={typeColor}>
            <span className="text-stone-100 text-sm leading-6">{analysisText}</span>
          </ResultCard>
        )}

        {fluencyText && (
          <ResultCard icon={BarChart3} label="流利度分析" color={typeColor}>
            <span className="text-stone-100 text-sm leading-6">{fluencyText}</span>
          </ResultCard>
        )}

        {completenessText && (
          <ResultCard icon={BarChart3} label="完整性分析" color={typeColor}>
            <span className="text-stone-100 text-sm leading-6">{completenessText}</span>
          </ResultCard>
        )}

        {suggestionsText && (
          <ResultCard icon={Lightbulb} label="改进建议" color={typeColor}>
            <span className="text-stone-100 text-sm leading-6">{suggestionsText}</span>
          </ResultCard>
        )}

        <button onClick={handleRetry} className="w-full rounded-xl py-4 flex items-center justify-center mt-6 transition-all active:scale-[0.98]" style={{ backgroundColor: typeColor, boxShadow: '0 6px 12px rgba(0,0,0,0.10)' }}>
         <RefreshCw size={16} color="#FFFFFF" />
         <span className="text-white text-base font-bold ml-2">重新练习</span>
       </button>
     </div>
    </div>
    </div>
  );
}

// === ScoringGuide ===
var SCORING_RULES = [
  { type: 'listen_choose', label: '听后选择', color: '#0EA5E9', icon: ListChecks, maxScore: 9,
    rules: ['每题1.5分，共6题', '每题2-3个选项，选择正确得分', '选错或不选不得分', '听力材料播放两遍'] },
  { type: 'listen_answer', label: '听后回答', color: '#10B981', icon: MessageCircle, maxScore: 12,
    rules: ['每题2分，共6题', '发音不准确但不影响理解，不扣分', '表达有语法错误但能说出关键词，不影响理解，不扣分', '不做答或所答与对话内容完全无关，不得分', '录音中出现多题答案，以最后答案为准', '零误差原则'] },
  { type: 'listen_retell', label: '听后转述', color: '#A855F7', icon: Repeat, maxScore: 10,
    rules: ['根据信息表转述听力内容', '信息点完整，每个信息点2分', '拼写错误不得分', '单复数扣分，大小写错误不扣分', '出现多余信息但不影响交际不扣分', '意思等值可给分（遵循交际原则）'] },
  { type: 'read_aloud', label: '短文朗读', color: '#F59E0B', icon: BookOpen, maxScore: 9,
    rules: ['满分档引入容错机制', '档内从宽原则', '个别错误指1-2个（不影响得分档）', '评分维度：语音语调、语速节奏、意群停顿、重读弱读', '如出现与作答无关的语音，做异常卷标记'] },
];

var GRADE_LEVELS = [
  { range: '8-9分', desc: '语音清晰，语调自然，节奏流畅，意群停顿恰当', color: '#10B981' },
  { range: '6-7分', desc: '语音基本清晰，偶有发音错误，语调基本自然', color: '#84CC16' },
  { range: '4-5分', desc: '语音有较多错误，部分影响理解，语调平淡', color: '#F59E0B' },
  { range: '2-3分', desc: '语音错误较多，影响理解，节奏不连贯', color: '#F97316' },
  { range: '0-1分', desc: '无法完成朗读，语音严重错误', color: '#EF4444' },
];

function ScoringGuide(props) {
  var type = props.type || '';
  var resp = useResponsive();
  var contentWidth = resp.isTablet ? resp.maxContentWidth : '100%';
  var filteredRules = type ? SCORING_RULES.filter(function(r) { return r.type === type; }) : SCORING_RULES;
  var isSingleType = !!type;

  return (
    <div className="min-h-screen card-fade-in" style={{ background: 'linear-gradient(180deg, #1B1B3A 0%, #25265A 100%)' }}>
    <div style={{ width: contentWidth, margin: '0 auto' }}>
      <div className="px-5 pt-6 pb-4 tech-grid" style={{ background: 'linear-gradient(135deg, #1E1B4B, #312E81, #4C1D95)', borderBottomLeftRadius: 20, borderBottomRightRadius: 20, boxShadow: '0 4px 20px rgba(76,29,149,0.3)' }}>
        <div className="flex items-center mb-2">
          <button onClick={function() { navigate(type ? '/practice/' + type : '/'); }} className="mr-3 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44, padding: 8 }}>
            <ArrowLeft size={18} color="#FFFFFF" />
          </button>
          <span className="text-white text-xl font-bold">{isSingleType ? filteredRules[0].label + '评分标准' : '评分标准'}</span>
        </div>
        <span className="text-stone-300 text-sm">参考北京市中考英语听说考试评分标准</span>
      </div>

      <div className="p-6 pb-20">
        {!isSingleType && (
          <div className="rounded-2xl p-5 mb-4" style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.14)', boxShadow: '0 4px 24px rgba(99,102,241,0.06)' }}>
            <div className="flex items-center mb-1">
              <ClipboardList size={16} color="#818CF8" />
              <span className="text-white text-base font-bold ml-2">总分构成</span>
            </div>
            <div className="flex justify-between">
              {SCORING_RULES.map(function(s) {
                return (
                  <div key={s.type} className="items-center flex-1 text-center">
                    <span className="text-2xl font-bold block" style={{ color: s.color }}>{s.maxScore}</span>
                    <span className="text-stone-300 text-xs">{s.label}</span>
                  </div>
                );
              })}
              <div className="items-center flex-1 text-center">
                <span className="text-2xl font-bold text-white block">40</span>
                <span className="text-stone-300 text-xs">总分</span>
              </div>
            </div>
          </div>
        )}

        {filteredRules.map(function(rule) {
          var RuleIcon = rule.icon;
          return (
            <div key={rule.type} className="rounded-2xl p-5 mb-4" style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.14)', boxShadow: '0 4px 24px rgba(99,102,241,0.06)' }}>
              <div className="flex items-center mb-1">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ backgroundColor: rule.color + '22' }}>
                  <RuleIcon size={14} color={rule.color} />
                </div>
                <span className="text-white text-base font-bold ml-2">{rule.label}</span>
                <div className="flex-1" />
                <span className="text-sm font-bold" style={{ color: rule.color }}>满分 {rule.maxScore} 分</span>
              </div>
              {rule.rules.map(function(r, idx) {
                return (
                  <div key={idx} className="flex items-start mb-2">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center mt-0.5" style={{ backgroundColor: rule.color + '22' }}>
                      <span className="text-xs font-bold" style={{ color: rule.color }}>{idx + 1}</span>
                    </div>
                    <span className="text-stone-300 text-sm flex-1 ml-2 leading-5">{r}</span>
                  </div>
                );
              })}
            </div>
          );
        })}

        {filteredRules.some(function(r) { return r.type === 'read_aloud'; }) && (
          <div className="rounded-2xl p-5 mb-4" style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.14)', boxShadow: '0 4px 24px rgba(234,88,12,0.08)' }}>
            <span className="text-white text-base font-bold block mb-3">短文朗读评分档次</span>
            {GRADE_LEVELS.map(function(g, idx) {
              return (
                <div key={idx} className="flex items-center mb-3">
                  <div className="w-16 rounded-lg py-1 text-center mr-3" style={{ backgroundColor: g.color + '22' }}>
                    <span className="text-xs font-bold" style={{ color: g.color }}>{g.range}</span>
                  </div>
                  <span className="text-stone-300 text-sm flex-1 leading-5">{g.desc}</span>
                </div>
              );
            })}
          </div>
        )}

        <div className="flex items-center justify-center mt-2">
          <Lightbulb size={12} color="#E2E8F0" />
         <span className="text-stone-300 text-xs ml-1">评分标准参考北京市中考英语听说机考评分标准。AI 评分仅供参考，实际考试以人工评分为准。</span>
        </div>
      </div>
    </div>
    </div>
  );
}

// === App ===
function App() {
  var route = useHashRoute();
  var parsed = parseRoute(route);
  var path = parsed.path, params = parsed.params;

  var FULLSCREEN_ROUTES = ['/practice-answer', '/exam-flow', '/scoring-guide', '/history-detail'];
  var hideTabBar = FULLSCREEN_ROUTES.some(function(r) { return path.startsWith(r); });

  var page = null;
  if (path === '/' || path === '') {
    page = <PracticeList type="listen_choose" />;
  } else if (path.indexOf('/practice/') === 0) {
    var ptype = path.replace('/practice/', '');
    page = <PracticeList type={ptype} />;
  } else if (path === '/practice-answer') {
    page = <PracticeAnswer questionId={Number(params.get('questionId'))} qType={params.get('type') || 'listen_choose'} />;
  } else if (path === '/exam') {
    page = <ExamMock />;
  } else if (path === '/exam-flow') {
    page = <ExamFlow paperId={Number(params.get('paperId'))} />;
  } else if (path === '/history') {
    page = <History />;
  } else if (path === '/history-detail') {
    page = <HistoryDetail recordId={Number(params.get('id'))} />;
  } else if (path === '/scoring-guide') {
    page = <ScoringGuide type={params.get('type') || ''} />;
  } else {
    page = <PracticeList type="listen_choose" />;
  }

  return (
    <div style={{ paddingBottom: hideTabBar ? 0 : 56 }}>
      {page}
      {!hideTabBar && <TabBar />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
function transformAppCode() {
  if (typeof Babel === 'undefined') {
    setTimeout(transformAppCode, 50);
    return;
  }
  var src = document.getElementById('app-source').textContent;
  try {
    var transformed = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    var script = document.createElement('script');
    script.textContent = transformed;
    document.body.appendChild(script);
  } catch(e) {
    console.error('Babel transform error:', e);
    var root = document.getElementById('root');
    if (root) root.innerHTML = '<div style="padding:20px;color:#ef4444;font-family:sans-serif">应用加载失败: ' + e.message + '</div>';
  }
}
document.addEventListener('DOMContentLoaded', transformAppCode);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SW_UPDATED') { window.location.reload(); }
      if (e.data && e.data.type === 'VERSION_MISMATCH') { window.location.reload(); }
    });
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function(reg) {
      // Force-check for SW update on every page load (bypasses 24h browser throttle)
      reg.update();
      // Also check every 60 seconds in case the page stays open
      setInterval(function() { reg.update(); }, 60000);
      // When a new SW is found and installed, tell it to skipWaiting immediately
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        }
      });
      // Send page version to SW for version-mismatch detection
      if (navigator.serviceWorker.controller) {
        var channel = new MessageChannel();
      navigator.serviceWorker.controller.postMessage({ type: 'CHECK_VERSION', version: 'v11' }, [channel.port2]);
        channel.port1.onmessage = function(e) {
          if (e.data && e.data.mismatch) { window.location.reload(); }
        };
      }
    }).catch(function(e) { console.log('SW registration failed:', e); });
  });
}
</script>
