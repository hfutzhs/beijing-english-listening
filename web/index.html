  { topic: "A School Trip to the Museum", intro: "Last Friday, the students went on a school trip. Here is some information about their visit.", script: "Last Friday, Class 3 went on a school trip to the Science Museum. They went there by school bus. The museum is in the city center. They arrived at nine o'clock in the morning. First, they watched a movie about space in the planetarium. Then, they visited the robot exhibition on the second floor. After lunch, they went to the gift shop and bought some souvenirs. They returned to school at three o'clock in the afternoon. Everyone had a great time.", points: [{ label: "When", answer: "Last Friday" }, { label: "Where", answer: "The Science Museum" }, { label: "Transportation", answer: "By school bus" }, { label: "First activity", answer: "Watched a movie about space" }, { label: "Second activity", answer: "Visited the robot exhibition" }, { label: "Return time", answer: "Three o'clock in the afternoon" }] },
  { topic: "A Birthday Party", intro: "Last Saturday, Jenny had a birthday party. Here is some information about the party.", script: "Last Saturday, Jenny celebrated her fourteenth birthday. She invited ten friends to her party. The party started at six o'clock in the evening. They had the party in her garden. Jenny's mother made a big chocolate cake. They ate pizza, fruit, and ice cream. After dinner, they played games and sang songs. Jenny got many presents. Her best friend gave her a diary. Everyone had a wonderful time.", points: [{ label: "When", answer: "Last Saturday" }, { label: "Whose birthday", answer: "Jenny's fourteenth birthday" }, { label: "How many guests", answer: "Ten friends" }, { label: "Where", answer: "In her garden" }, { label: "Food", answer: "Chocolate cake, pizza, fruit, and ice cream" }, { label: "Best present", answer: "A diary from her best friend" }] },
  { topic: "A Day at the Beach", intro: "Last Sunday, Tom and his family went to the beach. Here is some information about their day.", script: "Last Sunday, Tom went to the beach with his parents and sister. They drove there by car. It took about two hours. They arrived at ten in the morning. The weather was sunny and warm. Tom and his sister swam in the sea. Their father read a book under an umbrella. Their mother collected seashells. At noon, they had a picnic on the sand. They ate sandwiches and drank juice. They left the beach at five in the afternoon. It was a perfect day.", points: [{ label: "When", answer: "Last Sunday" }, { label: "Who", answer: "Tom, his parents, and his sister" }, { label: "Transportation", answer: "By car" }, { label: "Weather", answer: "Sunny and warm" }, { label: "Activities", answer: "Swimming, reading, and collecting seashells" }, { label: "Lunch", answer: "Sandwiches and juice" }] },
  { topic: "My New School", intro: "Amy just started at a new school. Here is some information about her school.", script: "Amy started at a new school this September. The school is called Sunshine Middle School. It is near her home, so she walks to school every day. It takes about ten minutes. Her school has three teaching buildings and a big library. There are forty classrooms. Amy's class has thirty-five students. Her favorite teacher is Miss Wang, who teaches English. Amy has made many new friends. She joins the school choir and practices singing every Wednesday afternoon. She likes her new school very much.", points: [{ label: "School name", answer: "Sunshine Middle School" }, { label: "How she goes", answer: "On foot, about ten minutes" }, { label: "Buildings", answer: "Three teaching buildings and a big library" }, { label: "Class size", answer: "Thirty-five students" }, { label: "Favorite teacher", answer: "Miss Wang (English teacher)" }, { label: "Club", answer: "The school choir, every Wednesday afternoon" }] },
  { topic: "A Camping Trip", intro: "Last weekend, a group of friends went camping. Here is some information about their trip.", script: "Last weekend, Mike and his three friends went camping at Forest Park. They rode their bicycles there. It took about forty minutes. They set up their tents near a small lake. In the afternoon, they went hiking in the forest and saw some beautiful birds. In the evening, they made a campfire and cooked hot dogs. They also told stories and sang songs around the fire. At night, they slept in their tents. The next morning, they packed up and went home. It was an exciting adventure.", points: [{ label: "When", answer: "Last weekend" }, { label: "Who", answer: "Mike and three friends" }, { label: "Where", answer: "Forest Park, near a small lake" }, { label: "Transportation", answer: "By bicycle, about forty minutes" }, { label: "Afternoon activity", answer: "Went hiking and saw beautiful birds" }, { label: "Evening activity", answer: "Made a campfire, cooked hot dogs, told stories, and sang songs" }] },
  { topic: "A Visit to the Zoo", intro: "Last Saturday, a class visited the zoo. Here is some information about their visit.", script: "Last Saturday, Class 5 visited the City Zoo. They went there by subway. They arrived at half past nine. First, they went to see the pandas. The pandas were eating bamboo. Then, they visited the monkeys. The monkeys were very playful. After that, they watched the elephant show. The elephants could draw pictures with their trunks. At lunchtime, they ate near the lake. They also visited the aquarium and saw many colorful fish. They left the zoo at four o'clock. It was a fun day.", points: [{ label: "When", answer: "Last Saturday" }, { label: "Where", answer: "The City Zoo" }, { label: "Transportation", answer: "By subway" }, { label: "First animals", answer: "Pandas eating bamboo" }, { label: "Show", answer: "The elephant show, elephants drawing pictures" }, { label: "Last visit", answer: "The aquarium with colorful fish" }] },
  { topic: "A Sports Meet", intro: "Last week, the school held a sports meet. Here is some information about the event.", script: "Last Thursday and Friday, our school held the annual sports meet. It was on the school playground. There were many events, including running, long jump, and relay races. Tom won first place in the 100-meter race. Lily came second in the long jump. Class 3 won the relay race. Many students and teachers came to watch and cheer. The principal gave medals to the winners. In the end, Class 3 got the most points and won the team championship. Everyone was excited and happy.", points: [{ label: "When", answer: "Last Thursday and Friday" }, { label: "Where", answer: "On the school playground" }, { label: "Events", answer: "Running, long jump, and relay races" }, { label: "100-meter winner", answer: "Tom, first place" }, { label: "Long jump", answer: "Lily, second place" }, { label: "Team champion", answer: "Class 3, the most points" }] },
  { topic: "My Hometown", intro: "Here is some information about a student's hometown.", script: "My hometown is a small city in the south of China. It has a population of about 500,000 people. The weather is warm and humid all year round. There are many beautiful parks and a famous lake in the center of the city. The lake is called Green Lake. People like to walk around it in the evening. The city is famous for its delicious food, especially the rice noodles. Every spring, there is a flower festival. Many tourists come to visit. I love my hometown very much.", points: [{ label: "Location", answer: "A small city in the south of China" }, { label: "Population", answer: "About 500,000 people" }, { label: "Weather", answer: "Warm and humid all year round" }, { label: "Famous place", answer: "Green Lake in the city center" }, { label: "Famous food", answer: "Rice noodles" }, { label: "Festival", answer: "A flower festival every spring" }] },
  { topic: "A Cooking Class", intro: "Last Wednesday, some students had a cooking class. Here is some information about the class.", script: "Last Wednesday, twenty students attended a cooking class at the community center. The teacher was Chef Wang. They learned to make Chinese dumplings. First, they prepared the dough with flour and water. Then, they made the filling with pork and cabbage. After that, they wrapped the dumplings. It was a bit difficult at first, but everyone got better with practice. Finally, they boiled the dumplings and ate them together. The dumplings were delicious. Everyone had fun and learned a new skill.", points: [{ label: "When", answer: "Last Wednesday" }, { label: "Where", answer: "At the community center" }, { label: "Teacher", answer: "Chef Wang" }, { label: "What they made", answer: "Chinese dumplings" }, { label: "Steps", answer: "Prepared dough, made filling, wrapped, and boiled" }, { label: "Filling", answer: "Pork and cabbage" }] },
  { topic: "A Visit to the Farm", intro: "Last weekend, a family visited a farm. Here is some information about their visit.", script: "Last weekend, Lucy and her family visited a farm in the countryside. They drove there by car. It took about one hour. The farm was very big. It had cows, sheep, chickens, and ducks. Lucy fed the sheep and collected eggs from the chickens. Her father milked a cow. Her mother picked fresh vegetables from the garden. At lunchtime, they had a farm meal with fresh eggs and vegetables. In the afternoon, they went horse riding. They left the farm at four o'clock. It was a wonderful experience.", points: [{ label: "When", answer: "Last weekend" }, { label: "Where", answer: "A farm in the countryside" }, { label: "Animals", answer: "Cows, sheep, chickens, and ducks" }, { label: "Lucy's activities", answer: "Fed the sheep and collected eggs" }, { label: "Father's activity", answer: "Milked a cow" }, { label: "Afternoon", answer: "Went horse riding" }] },
  { topic: "A Spring Festival", intro: "Here is some information about how a family celebrated Spring Festival.", script: "This year, our family celebrated Spring Festival at my grandparents' house. We went there by train on New Year's Eve. My grandmother made a big dinner. We had fish, dumplings, and many other delicious dishes. After dinner, we watched the Spring Festival Gala on TV. At midnight, we set off fireworks. The next morning, I received red envelopes from my grandparents and parents. In the afternoon, we visited our relatives. I played with my cousins. We had a great time together. Spring Festival is my favorite holiday.", points: [{ label: "Where", answer: "At grandparents' house" }, { label: "Transportation", answer: "By train on New Year's Eve" }, { label: "Dinner", answer: "Fish, dumplings, and other dishes" }, { label: "After dinner", answer: "Watched the Spring Festival Gala and set off fireworks" }, { label: "Morning", answer: "Received red envelopes" }, { label: "Afternoon", answer: "Visited relatives and played with cousins" }] },
  { topic: "A School Art Festival", intro: "Last Friday, the school held an art festival. Here is some information about the event.", script: "Last Friday, our school held the annual art festival in the school hall. It started at two o'clock in the afternoon. There were many performances. First, the school band played three songs. Then, some students performed a dance. After that, a group of students acted in a short play about friendship. The most popular performance was a magic show by Mr. Li, the math teacher. There was also an art exhibition in the lobby. Students showed their paintings and photos. The festival ended at five o'clock. Everyone enjoyed it very much.", points: [{ label: "When", answer: "Last Friday, from 2 PM to 5 PM" }, { label: "Where", answer: "In the school hall" }, { label: "First performance", answer: "The school band played three songs" }, { label: "Most popular", answer: "A magic show by Mr. Li" }, { label: "Other performances", answer: "A dance and a short play about friendship" }, { label: "Exhibition", answer: "Paintings and photos in the lobby" }] },
  { topic: "A Trip to the Mountains", intro: "Last summer, a family went on a trip to the mountains. Here is some information about their trip.", script: "Last summer, David and his family went to Mount Tai for a trip. They went there by high-speed train. It took about three hours. They arrived at the foot of the mountain at noon. They started climbing at one o'clock. It took them four hours to reach the top. They stayed overnight at a hotel on the mountain. The next morning, they woke up early to watch the sunrise. It was beautiful. After breakfast, they took a cable car down. It was a tiring but unforgettable trip.", points: [{ label: "When", answer: "Last summer" }, { label: "Where", answer: "Mount Tai" }, { label: "Transportation", answer: "By high-speed train, three hours" }, { label: "Climbing", answer: "Started at 1 PM, took four hours to reach the top" }, { label: "Overnight", answer: "Stayed at a hotel on the mountain" }, { label: "Highlight", answer: "Watched the sunrise the next morning" }] },
  { topic: "My Best Friend", intro: "Here is some information about a student's best friend.", script: "My best friend is Alice. We have been friends since primary school. She is thirteen years old, one year younger than me. She is tall and has long black hair. She is very kind and always helps others. Alice is good at math and science. She wants to be a scientist when she grows up. In her free time, she likes reading books and playing the piano. We often study together and share our secrets. We also go shopping on weekends. I'm lucky to have such a good friend.", points: [{ label: "Name", answer: "Alice" }, { label: "How long", answer: "Friends since primary school" }, { label: "Age", answer: "Thirteen, one year younger" }, { label: "Appearance", answer: "Tall with long black hair" }, { label: "Strengths", answer: "Good at math and science" }, { label: "Dream", answer: "To be a scientist" }] },
  { topic: "A Volunteer Experience", intro: "Last weekend, some students did volunteer work. Here is some information about their experience.", script: "Last Saturday, ten students from our class went to the Sunshine Nursing Home. They went there by bus at eight o'clock in the morning. First, they cleaned the rooms and the garden. Then, they talked with the elderly people and listened to their stories. Some students performed songs and dances. After that, they helped serve lunch. One student, Tom, cut hair for the elderly. They stayed there for about four hours. The elderly people were very happy. The students felt proud and learned a lot from the experience.", points: [{ label: "When", answer: "Last Saturday, from 8 AM" }, { label: "Where", answer: "Sunshine Nursing Home" }, { label: "Transportation", answer: "By bus" }, { label: "First activity", answer: "Cleaned rooms and the garden" }, { label: "Second activity", answer: "Talked with elderly and performed songs and dances" }, { label: "Special", answer: "Tom cut hair for the elderly" }] },
  { topic: "A New Pet", intro: "Here is some information about a student's new pet.", script: "Last month, my family got a new pet. It's a golden retriever puppy. We named him Max. He is three months old. He has soft golden fur and big brown eyes. Max is very playful and energetic. He loves running in the garden and chasing balls. Every morning, I take him for a walk in the park. He likes to meet other dogs. Max is also very smart. He can already sit, shake hands, and fetch. My mother feeds him twice a day. We all love Max very much.", points: [{ label: "What pet", answer: "A golden retriever puppy named Max" }, { label: "Age", answer: "Three months old" }, { label: "Appearance", answer: "Soft golden fur and big brown eyes" }, { label: "Personality", answer: "Playful and energetic" }, { label: "Daily activity", answer: "Morning walk in the park" }, { label: "Skills", answer: "Can sit, shake hands, and fetch" }] },
  { topic: "A Book Fair", intro: "Last weekend, there was a book fair in the city. Here is some information about the event.", script: "Last weekend, there was a big book fair at the City Exhibition Center. It was open from nine in the morning to six in the evening. There were more than one hundred bookstores and publishers. Books were on sale at discounted prices. There were also many activities. Famous writers gave talks and signed books. Children could join reading games and win prizes. There was a special area for comic books. I bought three novels and a dictionary. The fair was crowded but exciting. I hope to go again next year.", points: [{ label: "When", answer: "Last weekend, 9 AM to 6 PM" }, { label: "Where", answer: "City Exhibition Center" }, { label: "Size", answer: "More than 100 bookstores and publishers" }, { label: "Prices", answer: "Discounted prices" }, { label: "Activities", answer: "Writer talks, book signings, and reading games for children" }, { label: "Special", answer: "A special area for comic books" }] },
  { topic: "A Science Fair", intro: "Last Friday, the school held a science fair. Here is some information about the event.", script: "Last Friday, our school held a science fair in the gym. It started at one o'clock in the afternoon. There were thirty projects from different classes. Students showed their inventions and experiments. The first prize went to a group who made a solar-powered car. The second prize was for a water purification system. A robot that could sort rubbish won the third prize. Three teachers were the judges. Many students and parents came to watch. The fair ended at four o'clock. It was very inspiring and educational.", points: [{ label: "When", answer: "Last Friday, from 1 PM to 4 PM" }, { label: "Where", answer: "In the school gym" }, { label: "Number of projects", answer: "Thirty projects" }, { label: "First prize", answer: "A solar-powered car" }, { label: "Second prize", answer: "A water purification system" }, { label: "Third prize", answer: "A robot that sorts rubbish" }] },
  { topic: "A Train Journey", intro: "Here is some information about a student's train journey.", script: "Last summer, I took a train from Beijing to Xi'an with my parents. We took the high-speed train. It left at eight o'clock in the morning. The train was very comfortable and clean. It traveled at about 300 kilometers per hour. The journey took about five hours. During the trip, I looked out the window and saw fields, mountains, and rivers. A kind attendant brought us snacks and water. I also read a book and listened to music. We arrived in Xi'an at one o'clock. It was a pleasant journey.", points: [{ label: "From/To", answer: "Beijing to Xi'an" }, { label: "Train type", answer: "High-speed train" }, { label: "Departure", answer: "8 AM" }, { label: "Speed", answer: "About 300 km/h" }, { label: "Duration", answer: "About five hours" }, { label: "Activities", answer: "Looked out the window, read a book, and listened to music" }] },
  { topic: "A Garden Project", intro: "Here is some information about a school garden project.", script: "This spring, our class started a garden project behind the school. We planted tomatoes, cucumbers, and sunflowers. Every student had a role. Some prepared the soil. Others planted seeds. Some watered the plants every day. Our teacher, Mr. Chen, taught us how to care for the plants. After two months, the tomatoes turned red. The sunflowers grew very tall. We harvested the vegetables and made a salad in class. We also shared some vegetables with other classes. It was a great experience. We learned about nature and teamwork.", points: [{ label: "When", answer: "This spring" }, { label: "Where", answer: "Behind the school" }, { label: "What they planted", answer: "Tomatoes, cucumbers, and sunflowers" }, { label: "Teacher", answer: "Mr. Chen" }, { label: "Harvest", answer: "After two months, tomatoes turned red, sunflowers grew tall" }, { label: "What they did with harvest", answer: "Made a salad and shared with other classes" }] },
  { topic: "A Music Concert", intro: "Last Saturday evening, there was a music concert at school. Here is some information about the event.", script: "Last Saturday evening, our school held a music concert in the auditorium. It started at seven o'clock. More than two hundred people came to watch. The concert had many performances. The school orchestra played first. Then, a girl named Lily sang a beautiful English song. After that, a boy played the piano solo. The school dance team performed a modern dance. The most exciting part was the band competition. Three student bands competed. The band 'Sunshine' won the first prize. The concert ended at nine thirty. Everyone had a wonderful evening.", points: [{ label: "When", answer: "Last Saturday evening, 7 PM to 9:30 PM" }, { label: "Where", answer: "In the school auditorium" }, { label: "Audience", answer: "More than 200 people" }, { label: "First performance", answer: "The school orchestra" }, { label: "Solo", answer: "Lily sang an English song, a boy played piano" }, { label: "Winner", answer: "The band 'Sunshine' won first prize" }] },

  { passage: "Reading is a wonderful habit that can enrich our lives. Through reading, we can explore different worlds and learn about various cultures. Books can take us to places we have never been and introduce us to people we have never met. When we read, we improve our vocabulary and thinking skills. It is important to read every day, even if it is just for a few minutes. You can read books, newspapers, or magazines. The more you read, the more you will know. So pick up a book today and start your reading journey." },
  { passage: "Spring is my favorite season of the year. The weather becomes warmer and the days get longer. Trees turn green and flowers begin to bloom everywhere. Birds sing happily in the early morning. People take off their heavy winter clothes and go outside to enjoy the sunshine. Children fly kites in the park. Families go on picnics together. Farmers start planting seeds in the fields. Spring is a season of hope and new beginnings. Everything comes back to life after the cold winter. I always feel happy and energetic in spring." },
  { passage: "Healthy eating is very important for our body and mind. We should eat different kinds of food every day. Vegetables and fruits give us vitamins. Meat, fish, and eggs provide protein. Rice and bread give us energy. We should also drink plenty of water. It is not good to eat too much junk food or drink too many soft drinks. Breakfast is the most important meal of the day. We should never skip it. Eating slowly and chewing well is also important. Good eating habits can help us stay strong and healthy." },
  { passage: "Sports are an important part of our lives. Doing sports can make us strong and healthy. There are many kinds of sports we can do. Some people like running and swimming. Others enjoy playing basketball, football, or tennis. Team sports can teach us how to work together with others. They also help us make new friends. When we play sports, we should always be safe. We need to warm up before exercising and drink enough water. Doing sports for thirty minutes every day can make a big difference to our health." },
  { passage: "Friendship is one of the most precious things in life. A true friend is someone who is always there for you. They share your happiness and help you when you are sad. Good friends trust each other and tell the truth. They do not judge you when you make mistakes. Instead, they help you learn from them. To keep a friendship, we need to be honest, kind, and patient. We should spend time together and listen to each other. A good friend is like a treasure. We should value our friendships and cherish our friends." },
  { passage: "Traveling is a great way to learn about the world. When we travel, we see new places and meet new people. We can learn about different cultures and try different foods. Traveling helps us relax and forget about our worries. It also teaches us how to solve problems and be independent. Before a trip, we should plan carefully. We need to pack the right things and check the weather. During the trip, we should be respectful of local customs. Traveling may cost money, but the memories and experiences are priceless. It is always worth it." },
  { passage: "The Internet has changed our lives in many ways. We can use it to learn, to shop, to communicate, and to have fun. Students can find information for their homework online. People can buy things without leaving home. We can talk to friends and family who live far away. However, the Internet can also be harmful. We should not spend too much time online. We need to protect our personal information. We should not believe everything we read on the Internet. Using the Internet wisely is an important skill in the modern world." },
  { passage: "Environmental protection is everyone's responsibility. Our planet is facing many problems, such as pollution and climate change. We can all do something to help. We can reduce waste by using fewer plastic bags and bottles. We can recycle paper, glass, and metal. We can save water by turning off the tap when brushing our teeth. We can save energy by turning off lights when we leave a room. Planting trees is also a great way to help the environment. If everyone does a little, together we can make a big difference for our planet." },
  { passage: "Music is an important part of human life. It can make us happy, calm, or excited. Different people like different kinds of music. Some enjoy pop music because it is catchy and fun. Others prefer classical music because it is beautiful and peaceful. Music can also help us learn. Studies show that listening to music can improve our memory and focus. Many students like to listen to soft music while studying. Playing an instrument is even better. It helps us think creatively and express our feelings. Music is truly a universal language that connects people." },
  { passage: "Learning a foreign language is a valuable skill. English is one of the most widely spoken languages in the world. It can help us communicate with people from different countries. When we learn a language, we also learn about the culture. There are many ways to improve our English. We can read English books, watch English movies, and listen to English songs. Speaking with native speakers is very helpful. We should not be afraid of making mistakes. Practice is the key to success. The more we practice, the better we will become." },
  { passage: "Family is the most important thing in our lives. Our parents love us and take care of us from the day we are born. They teach us how to walk, how to talk, and how to be a good person. We should always be grateful to our parents. Spending time with family is important. We can have meals together, watch TV together, or go on trips together. We should help our parents with housework. When we grow up, we should take care of them just as they took care of us. A happy family is the greatest treasure." },
  { passage: "Everyone has a dream. Some people dream of becoming doctors or scientists. Others want to be artists or athletes. Dreams give us direction and motivation. They make us work hard and never give up. However, having a dream is not enough. We need to take action. We should set goals and make plans. We should learn the skills we need. There will be difficulties along the way, but we should not be afraid. Every small step brings us closer to our dream. Remember, it is never too early or too late to follow your dreams." },
  { passage: "Autumn is a beautiful season. The leaves on the trees change color. They turn from green to yellow, orange, and red. The weather becomes cooler and the air is fresh. Farmers are busy harvesting their crops. It is a season of harvest and thanksgiving. People like to go hiking in the mountains to enjoy the colorful scenery. Children collect fallen leaves and make beautiful pictures. The Mid-Autumn Festival usually falls in autumn. Families get together to eat mooncakes and admire the full moon. Autumn is a peaceful and colorful season that many people love." },
  { passage: "Technology has made our lives easier in many ways. Smartphones let us communicate with anyone, anywhere. Computers help us work and study more efficiently. The Internet gives us access to a world of information. Electric cars are better for the environment. Online shopping saves us time and effort. However, technology also brings challenges. People spend too much time looking at screens. Children play video games instead of going outside. We need to find a balance between using technology and living in the real world. Technology is a tool, and we should use it wisely." },
  { passage: "Water is essential for all living things. Without water, there would be no life on Earth. Our bodies are made up of about sixty percent water. We need water to drink, to cook, and to clean. Plants and animals also need water to survive. However, clean water is becoming scarce in many parts of the world. We should not waste water. We can take shorter showers and fix leaking taps. We should not pollute rivers and lakes. Protecting our water resources is important for the future of our planet. Every drop counts." },
  { passage: "Reading newspapers is a good way to stay informed about the world. We can learn about what is happening in our city, our country, and other countries. Newspapers cover many topics, such as politics, sports, business, and entertainment. Reading newspapers can also improve our language skills. We learn new words and expressions. We can also practice our reading comprehension. Some people prefer reading print newspapers, while others read news online. Both are fine. The important thing is to stay curious about the world and keep learning every day." },
  { passage: "Volunteering is a wonderful way to help others and help ourselves. When we volunteer, we give our time and energy to people in need. We can help the elderly, teach children, or protect the environment. Volunteering teaches us kindness and patience. It helps us understand different people and different lives. It also gives us a sense of purpose and achievement. Many young people volunteer during their holidays. It is a meaningful way to spend free time. When we help others, we also feel happy. As the saying goes, the more we give, the more we receive." },
  { passage: "Everyone has hobbies. A hobby is something we do for fun in our free time. Some people like collecting things, such as stamps or coins. Others enjoy creative activities like drawing or writing. Many people like outdoor activities such as hiking or cycling. Some prefer indoor activities like reading or cooking. Hobbies help us relax and reduce stress. They make our lives more interesting and colorful. They can also help us make friends who share the same interests. It is never too late to start a new hobby. The important thing is to find something you truly enjoy." },
  { passage: "The Great Wall of China is one of the most famous landmarks in the world. It was built over two thousand years ago. It stretches for thousands of kilometers across northern China. The Wall was built to protect the country from invaders. Millions of workers worked on it for centuries. Today, the Great Wall is a popular tourist destination. People from all over the world come to visit it. Walking on the Wall is an amazing experience. You can see the beautiful mountains and valleys around it. The Great Wall is a symbol of Chinese history and culture." },
  { passage: "Good manners are important in our daily lives. Saying please and thank you shows respect for others. We should be polite to everyone, including our family, friends, and strangers. When we meet someone, we should greet them warmly. When we make a mistake, we should apologize. We should not interrupt when others are speaking. We should wait in line patiently. Good manners make people feel comfortable and respected. They help us build good relationships. Parents should teach their children good manners from a young age. Good manners are a sign of a good person." },
  { passage: "Time is one of the most valuable things we have. Once time passes, it never comes back. We should use our time wisely. Making a schedule can help us manage our time better. We should decide what is important and do it first. We should not spend too much time on things that are not useful, like playing games or watching too much TV. It is also important to take breaks and rest. A good balance between work and rest makes us more productive. Remember, time is limited. We should make every minute count and live each day to the fullest." },
];

function generateQuestions() {
  var questions = [];
  var id = 1;
  var numPapers = 21;
  for (var paper = 1; paper <= numPapers; paper++) {
    var title = 'Beijing Exam Practice Paper ' + paper;
    for (var i = 0; i < 6; i++) {
      var si = ((paper - 1) * 6 + i) % lcSeeds.length;
      var s = lcSeeds[si];
      questions.push({ id: id++, type: 'listen_choose', paper_id: paper, section_index: 1, difficulty_group: i+1, difficulty_coefficient: parseFloat((1.0+(paper-1)*0.02).toFixed(2)), title: title, content: { question: s.question, options: s.options, correct_answer: s.correct }, audio_script: s.script, max_score: 1.5 });
    }
    for (var i = 0; i < 6; i++) {
      var si = ((paper - 1) * 6 + i) % laSeeds.length;
      var s = laSeeds[si];
      questions.push({ id: id++, type: 'listen_answer', paper_id: paper, section_index: 2, difficulty_group: i+1, difficulty_coefficient: parseFloat((1.0+(paper-1)*0.02).toFixed(2)), title: title, content: { question: s.question, sample_answer: s.answer, keywords: s.keywords }, audio_script: s.script, max_score: 2 });
    }

                  <span className="text-slate-500 text-xs font-bold block mb-2">问题</span>

              {currentQuestion.type === 'listen_retell' && (
                <div className="rounded-2xl p-5 mb-4" style={{ background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(12px)', border: '1px solid rgba(99,102,241,0.10)', boxShadow: '0 2px 12px rgba(99,102,241,0.04)' }}>
                  <span className="text-slate-500 text-xs font-bold block mb-1">转述主题</span>
                  <span className="text-slate-800 text-sm font-bold block mb-3">{currentQuestion.content.topic}</span>

                    <p className="text-slate-500 text-xs mb-4">{currentQuestion.content.intro}</p>

                  <div className="rounded-2xl overflow-hidden" style={{ border: '1px solid rgba(99,102,241,0.10)' }}>
                    {currentQuestion.content.info_points.map(function(point, idx) {
                      return (
                        <div key={idx} className="flex items-start p-3"
                          style={{ background: idx % 2 === 0 ? 'rgba(99,102,241,0.03)' : 'transparent', borderTop: idx > 0 ? '1px solid rgba(99,102,241,0.10)' : 'none' }}>
                          <span className="rounded-md px-2 py-0.5 text-xs font-bold flex-shrink-0"
                            style={{ backgroundColor: currentSectionConfig.color + '22', color: currentSectionConfig.color }}>{point.label}</span>
                          <span className="text-slate-700 text-xs ml-3 flex-1">{point.answer}</span>

                      );
                    })}
                  </div>
                </div>
              )}

              {currentQuestion.type !== 'listen_choose' && (
                <div className="mb-4">
                 <RecordButton recording={recorder.recording} recordedUrl={recorder.recordedUrl} playing={recorder.playing} transcribing={recorder.transcribing} recordingTime={recorder.recordingTime} color={currentSectionConfig.color} onStart={recorder.startRecording} onStop={handleStopRecording} onPlay={recorder.playRecording} />
                  {recorder.whisperProgress && recorder.transcribing && (
                    <div className="rounded-xl p-3 mt-3 text-center" style={{ background: 'rgba(99,102,241,0.06)', border: '1px solid rgba(99,102,241,0.10)' }}>
                      <span className="text-indigo-500 text-xs block">{recorder.whisperProgress}</span>
                    </div>
                  )}
                  {recorder.error && (
                    <div className="rounded-xl p-3 mt-3 text-sm" style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.15)', color: '#EF4444' }}>{recorder.error}</div>
                  )}
                  {recorder.recording && (
                    <div className="rounded-xl p-3 mt-3" style={{ background: 'rgba(99,102,241,0.06)', border: '1px solid rgba(99,102,241,0.10)' }}>
                      <span className="text-indigo-500 text-xs block">录音中... 停止后将自动识别语音内容</span>
                    </div>
                  )}
                  <div className="mt-3">
                    <textarea value={textInput} onChange={function(e) { handleTextInputChange(e.target.value); }} placeholder="录音后自动填入识别文本，也可手动输入" rows={2} className="w-full rounded-xl p-3 text-sm resize-none" style={{ background: 'rgba(255,255,255,0.95)', color: '#1E293B', border: '1px solid rgba(99,102,241,0.08)', outline: 'none', fontFamily: 'inherit' }} />

                </div>

            </React.Fragment>

        <div className="flex gap-2 px-5 py-3" style={{ background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(20px)', borderTop: '1px solid rgba(99,102,241,0.10)', paddingBottom: 'max(12px, env(safe-area-inset-bottom, 0px))' }}>
          <button onClick={function() { setCurrentIdx(Math.max(0, currentIdx - 1)); }} disabled={currentIdx <= 0}
            className="rounded-xl px-4 py-4 flex items-center justify-center transition-all active:scale-[0.98] disabled:opacity-40" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
            <ChevronLeft size={16} color="#94A3B8" />
            <span className="text-slate-500 font-semibold text-sm ml-1">上一题</span>
          </button>
          {currentIdx < totalQuestions - 1 ? (
            <button onClick={function() { setCurrentIdx(Math.min(totalQuestions - 1, currentIdx + 1)); }}
              className="flex-1 rounded-2xl py-4 flex items-center justify-center transition-all active:scale-[0.98]" style={{ background: EXAM_HEADER_GRADIENT, boxShadow: '0 8px 24px rgba(99,102,241,0.3)' }}>
              <span className="text-white font-bold text-sm mr-1">下一题</span>
              <ChevronRight size={16} color="#FFFFFF" />
            </button>
          ) : (
            <button onClick={handleSubmitExam} disabled={submitting || !allAnswered}
              className="flex-1 rounded-xl py-4 flex items-center justify-center transition-all active:scale-[0.98] disabled:opacity-50"
              style={{ backgroundColor: submitting ? '#F87171' : EXAM_HEADER_COLOR }}>
              {submitting ? (
                <React.Fragment>
                  <div className="w-4 h-4 border-2 rounded-full animate-spin mr-2" style={{ borderColor: '#FFFFFF', borderTopColor: 'transparent' }} />
                  <span className="text-white font-bold text-sm">评分中...</span>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <Send size={16} color="#FFFFFF" />
                  <span className="text-white font-bold text-sm ml-2">{allAnswered ? '交卷' : '交卷 (' + answeredCount + '/' + totalQuestions + ')'}</span>

              )}

         )}
       </div>
     </div>

      {examSubmitError && !examResults && (
        <div className="rounded-xl p-3 mt-3 flex items-start" style={{ background: "rgba(239,68,68,0.12)", border: "1px solid rgba(239,68,68,0.20)" }}>
          <AlertCircle size={16} color="#DC2626" style={{ flexShrink: 0, marginTop: 1 }} />
          <span className="text-red-700 text-xs ml-2 leading-5 block">{examSubmitError}</span>
        </div>
      )}

      {showExitConfirm && (
        <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: 'rgba(15,23,42,0.4)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)' }} onClick={function() { setShowExitConfirm(false); }}>
          <div className="rounded-xl p-7" style={{ background: 'rgba(255,255,255,0.98)', backdropFilter: 'blur(24px)', border: '1px solid rgba(99,102,241,0.08)', boxShadow: '0 16px 48px rgba(99,102,241,0.2)', width: '80%', maxWidth: 320, borderRadius: 24 }} onClick={function(e) { e.stopPropagation(); }}>
            <div className="flex flex-col items-center mb-5">
              <div className="w-14 h-14 rounded-xl flex items-center justify-center" style={{ backgroundColor: 'rgba(239,68,68,0.08)' }}>
                <AlertCircle size={22} color="#DC2626" />
              </div>
            </div>
            <span className="text-slate-800 text-lg font-bold text-center block mb-2">确认退出</span>
            <span className="text-slate-500 text-sm text-center block mb-6">{answeredCount > 0 ? '已答 ' + answeredCount + '/' + totalQuestions + ' 题，退出后答题记录不会保存。确定要退出吗？' : '退出后答题记录不会保存。确定要退出吗？'}</span>
            <div className="flex gap-3">
              <button onClick={function() { setShowExitConfirm(false); }} className="flex-1 py-4 rounded-xl" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
                <span className="text-indigo-600 font-semibold">继续考试</span>
              </button>
              <button onClick={function() { navigate('/exam'); }} className="flex-1 py-4 rounded-xl" style={{ background: 'linear-gradient(135deg, #DC2626, #EF4444)', boxShadow: '0 4px 16px rgba(220,38,38,0.15)' }}>
                <span className="text-white font-semibold">退出</span>
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// === History ===
var HISTORY_TYPE_LABEL = {
  read_aloud: '短文朗读',
  listen_choose: '听后选择',
  listen_answer: '听后回答',
  listen_retell: '听后转述',
};
var HISTORY_TYPE_COLOR = {
  read_aloud: '#6366F1',
  listen_choose: '#6366F1',
  listen_answer: '#6366F1',
  listen_retell: '#6366F1',
};
var FILTER_TYPES = [
  { value: '', label: '全部' },
  { value: 'listen_choose', label: '听后选择' },
  { value: 'listen_answer', label: '听后回答' },
  { value: 'listen_retell', label: '听后转述' },
  { value: 'read_aloud', label: '短文朗读' },
];

function historyScoreColor(ratio) {
  if (ratio >= 0.8) return '#10B981';
  if (ratio >= 0.6) return '#F59E0B';
  return '#DC2626';
}

function StatItem(props) {
  var Icon = props.icon, label = props.label, value = props.value, color = props.color, suffix = props.suffix || '';
  return (
    <div className="flex-1 flex flex-col items-center">
      <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-1.5" style={{ backgroundColor: color + '22' }}>
        <Icon size={15} color={color} />
      </div>
      <span className="text-slate-800 text-lg font-bold">{value}{suffix}</span>
      <span className="text-slate-500 text-xs mt-0.5">{label}</span>
    </div>
  );
}

function History() {
  var deviceId = useDeviceId();
  var resp = useResponsive();
  var isTablet = resp.isTablet, contentPadding = resp.contentPadding, cardColumns = resp.cardColumns, maxContentWidth = resp.maxContentWidth;
  var recState = useState([]), records = recState[0], setRecords = recState[1];
  var lState = useState(true), loading = lState[0], setLoading = lState[1];
  var ftState = useState(''), filterType = ftState[0], setFilterType = ftState[1];
  var woState = useState(false), wrongOnly = woState[0], setWrongOnly = woState[1];
  var cmState = useState(false), clearModalVisible = cmState[0], setClearModalVisible = cmState[1];
  var clState = useState(false), clearing = clState[0], setClearing = clState[1];

  var loadData = useCallback(async function() {
    if (!deviceId) return;
    setLoading(true);
    try {
      var data = await fetchHistory(deviceId);
      setRecords(data);
    } catch(e) {} finally { setLoading(false); }
  }, [deviceId]);

  useEffect(function() { loadData(); }, [loadData]);

  var handleClearConfirm = useCallback(async function() {
    if (!deviceId) return;
    setClearing(true);
    try {
      await clearHistory(deviceId);
      setRecords([]);
      setClearModalVisible(false);
    } catch(e) {} finally { setClearing(false); }
  }, [deviceId]);

  var filteredRecords = records.filter(function(r) {
    if (filterType && r.question_type !== filterType) return false;
    if (wrongOnly && !r.is_failed) return false;
    return true;
  });

  var totalExams = filteredRecords.length;
  var passCount = filteredRecords.filter(function(r) {
    var ms = r.max_score || 0;
    return ms > 0 && r.score / ms >= 0.6;
  }).length;
  var failCount = totalExams - passCount;
  var avgScore = totalExams > 0
    ? Math.round(filteredRecords.reduce(function(sum, r) {
        var ms = r.max_score || 0;
        return sum + (ms > 0 ? (r.score / ms) * 100 : 0);
      }, 0) / totalExams)
    : 0;

  var contentWidth = isTablet ? maxContentWidth : '100%';

  return (
    <div className="fit-screen" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
      <div style={{ width: contentWidth, margin: '0 auto', minHeight: '100%', display: 'flex', flexDirection: 'column', overflow: 'visible' }}>
        <div className="px-5 pt-4 pb-2 tech-grid" style={{ background: HISTORY_HEADER_GRADIENT, boxShadow: '0 4px 20px rgba(99,102,241,0.08)', borderBottomLeftRadius: 24, borderBottomRightRadius: 24 }}>
          <div className="flex items-center justify-between">
            <div className="flex-1">
              <span className="text-white text-xl font-extrabold block">历史记录</span>
              <span className="text-white/80 text-xs mt-0.5 block">各项练习和考试成绩</span>
            </div>
            {records.length > 0 && (
              <button onClick={function() { setClearModalVisible(true); }} className="rounded-xl px-4 py-2.5 flex items-center" style={{ backgroundColor: 'rgba(99,102,241,0.08)' }}>
                <Trash2 size={12} color="#4F46E5" />
                <span className="text-indigo-600 text-sm font-semibold ml-1.5">清空</span>
              </button>
            )}
          </div>
        </div>

        <div style={{ paddingLeft: contentPadding, paddingRight: contentPadding, marginTop: -5, marginBottom: 8 }}>
          <div className="flex rounded-2xl p-4" style={{ background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(12px)', border: '1px solid rgba(99,102,241,0.10)', boxShadow: '0 2px 12px rgba(99,102,241,0.06)' }}>
            <StatItem icon={ClipboardList} label="总练习" value={totalExams} color="#94A3B8" />
            <div style={{ width: 1, background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }} />
            <StatItem icon={CheckCircle} label="及格" value={passCount} color="#10B981" />
            <div style={{ width: 1, background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }} />
            <StatItem icon={XCircle} label="不及格" value={failCount} color="#DC2626" />
            <div style={{ width: 1, background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }} />
            <StatItem icon={BarChart3} label="平均分" value={avgScore} color="#F59E0B" suffix="%" />
          </div>
        </div>

        <div style={{ paddingLeft: contentPadding, paddingRight: contentPadding, marginBottom: 8 }}>
          <div className="flex items-center gap-2 overflow-x-auto scrollbar-hide py-2">
            {FILTER_TYPES.map(function(ft) {
              return (
                <button key={ft.value} onClick={function() { setFilterType(ft.value); }}
                  className="rounded-full px-4 py-2 whitespace-nowrap transition-all"
                  style={{ background: filterType === ft.value ? HISTORY_HEADER_GRADIENT : 'rgba(255,255,255,0.95)', border: filterType === ft.value ? 'none' : '1px solid rgba(99,102,241,0.10)', color: filterType === ft.value ? '#FFFFFF' : '#64748B', fontWeight: 600, fontSize: 14 }}>
                  {ft.label}
                </button>
              );
            })}
            <button onClick={function() { setWrongOnly(!wrongOnly); }}
              className="rounded-full px-4 py-2 whitespace-nowrap transition-all flex items-center"
              style={{ background: wrongOnly ? 'linear-gradient(135deg, #DC2626, #EF4444)' : 'rgba(255,255,255,0.95)', border: wrongOnly ? 'none' : '1px solid rgba(99,102,241,0.10)', color: wrongOnly ? '#FFFFFF' : '#64748B', fontWeight: 600, fontSize: 14 }}>
              <XCircle size={12} style={{ marginRight: 4 }} />
              只看错题
            </button>
          </div>
        </div>

        <div className="scroll-area" style={{ paddingLeft: contentPadding, paddingRight: contentPadding, paddingTop: 4, paddingBottom: 60 }}>
          {loading ? (
            <div className="flex flex-col items-center py-20">
              <div className="w-16 h-16 rounded-xl flex items-center justify-center mb-4" style={{ backgroundColor: HISTORY_HEADER_COLOR + '22', borderRadius: 16 }}>
                <div className="w-8 h-8 border-2 rounded-full animate-spin" style={{ borderColor: HISTORY_HEADER_COLOR, borderTopColor: 'transparent' }} />
              </div>
              <span className="text-slate-500 text-sm">加载记录中...</span>
            </div>
          ) : filteredRecords.length === 0 ? (
            <div className="flex flex-col items-center py-20">
              <div className="w-16 h-16 rounded-xl flex items-center justify-center mb-4" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
                <ClockRotateLeft size={28} color="#6366F1" />
              </div>
              <span className="text-slate-500 text-base font-medium">暂无历史记录</span>
              <span className="text-slate-500 mt-1 text-sm">完成练习后这里会显示成绩</span>
            </div>
          ) : (
            <div className="flex flex-wrap" style={{ gap: 12 }}>
              {filteredRecords.map(function(item) {
                var ms = item.max_score || 0;
                var ratio = ms > 0 ? item.score / ms : 0;
                var scoreColor = historyScoreColor(ratio);
                var typeKey = item.question_type || 'unknown';
                var typeColor = HISTORY_TYPE_COLOR[typeKey] || '#94A3B8';
                var grade = getGrade(ratio);
                return (
                  <button key={item.id} onClick={function() { navigate('/history-detail?id=' + item.id); }}
                    className="rounded-xl p-3 flex items-center transition-all active:scale-[0.98] text-left"
                    style={{ width: 'calc(' + (100 / cardColumns) + '% - ' + ((cardColumns - 1) * 12 / cardColumns) + 'px)', background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(12px)', border: '1px solid rgba(99,102,241,0.10)', boxShadow: '0 2px 12px rgba(99,102,241,0.06)' }}>
                    <div className="rounded-xl flex flex-col items-center justify-center" style={{ width: 56, height: 56, backgroundColor: scoreColor + '22', flexShrink: 0 }}>
                      <span className="text-xl font-bold" style={{ color: scoreColor }}>{item.score}</span>
                      <span className="text-xs" style={{ color: scoreColor + '99' }}>/ {ms}</span>
                    </div>
                    <div className="flex-1 ml-4 overflow-hidden">
                      <div className="flex items-center">
                        <span className="rounded-full px-2 py-0.5 text-xs font-semibold" style={{ backgroundColor: typeColor + '22', color: typeColor }}>
                          {HISTORY_TYPE_LABEL[typeKey] || item.question_type}
                        </span>
                        <span className="rounded-full px-2 py-0.5 ml-1.5 text-xs font-medium" style={{ backgroundColor: scoreColor + '22', color: scoreColor }}>
                          {grade}
                        </span>
                      </div>
                      <span className="text-slate-700 text-sm font-medium mt-1.5 block truncate">{item.question_title || '练习记录'}</span>
                      <span className="text-slate-500 text-xs mt-0.5 block">{item.created_at ? new Date(item.created_at).toLocaleString('zh-CN') : ''}</span>
                    </div>
                    <ChevronRight size={12} color="#94A3B8" style={{ flexShrink: 0, marginLeft: 4 }} />
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {clearModalVisible && (
        <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: 'rgba(15,23,42,0.4)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)' }} onClick={function() { setClearModalVisible(false); }}>
          <div className="rounded-xl p-7" style={{ background: 'rgba(255,255,255,0.98)', backdropFilter: 'blur(24px)', border: '1px solid rgba(99,102,241,0.08)', boxShadow: '0 16px 48px rgba(99,102,241,0.2)', width: '80%', maxWidth: 320, borderRadius: 24 }} onClick={function(e) { e.stopPropagation(); }}>
            <div className="flex flex-col items-center mb-5">
              <div className="w-14 h-14 rounded-xl flex items-center justify-center" style={{ backgroundColor: 'rgba(239,68,68,0.08)' }}>
                <Trash2 size={22} color="#DC2626" />
              </div>
            </div>
            <span className="text-slate-800 text-lg font-bold text-center block mb-2">确认清空</span>
            <span className="text-slate-500 text-sm text-center block mb-6">将删除所有历史记录，此操作不可恢复。确定要清空吗？</span>
            <div className="flex gap-3">
              <button onClick={function() { setClearModalVisible(false); }} className="flex-1 py-4 rounded-xl" style={{ background: 'linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 100%)' }}>
                <span className="text-indigo-600 font-semibold">取消</span>
              </button>
              <button onClick={handleClearConfirm} disabled={clearing} className="flex-1 py-4 rounded-xl" style={{ backgroundColor: clearing ? '#F87171' : '#DC2626' }}>
                <span className="text-white font-semibold">{clearing ? '清空中...' : '清空'}</span>
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// === HistoryDetail ===
var HD_TYPE_LABEL = {
  read_aloud: '短文朗读',

var VOCAB_SETTINGS_KEY = 'vocab_daily_count';
var VOCAB_PROGRESS_KEY = 'vocab_progress';

function getDailyCount() {
  try { return parseInt(localStorage.getItem(VOCAB_SETTINGS_KEY)) || 200; }
  catch(e) { return 200; }
}
function getTodayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function getVocabProgress() {
  try {
    var raw = localStorage.getItem(VOCAB_PROGRESS_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch(e) { return {}; }
}
function saveVocabProgress(progress) {
  try { localStorage.setItem(VOCAB_PROGRESS_KEY, JSON.stringify(progress)); } catch(e) {}
}

// VOCAB_BANK total computed dynamically in component

// Count cumulative "slain" (mastered) words: unique words answered correctly across all days
function getCumulativeSlainCount() {
  var progress = getVocabProgress();
  var slainSet = {};
  Object.keys(progress).forEach(function(date) {
    var dayData = progress[date];
    if (dayData && dayData.results) {
      Object.keys(dayData.results).forEach(function(word) {
        if (dayData.results[word] === 'correct') slainSet[word] = true;
      });
    }
  });
  return Object.keys(slainSet).length;
}

// Count total unique words attempted across all days
function getCumulativeAttemptedCount() {
  var progress = getVocabProgress();
  var attemptedSet = {};
  Object.keys(progress).forEach(function(date) {
    var dayData = progress[date];
    if (dayData && dayData.results) {
      Object.keys(dayData.results).forEach(function(word) {
        attemptedSet[word] = true;
      });
    }
  });
  return Object.keys(attemptedSet).length;
}

// Daily word selection: seed by date + count, prioritize wrong words from past days
function generateDailyWords(count) {
  var progress = getVocabProgress();
  var wrongWordSet = {};
  var passedWordSet = {};
  Object.keys(progress).forEach(function(date) {
    var dayData = progress[date];
    if (dayData && dayData.results) {
      Object.keys(dayData.results).forEach(function(word) {
        if (dayData.results[word] === 'wrong') wrongWordSet[word] = true;
        else if (dayData.results[word] === 'correct') passedWordSet[word] = true;
      });
    }
  });
  // Build pools
  var wrongPool = VOCAB_BANK.filter(function(w) { return wrongWordSet[w.en] && !passedWordSet[w.en]; });
  var freshPool = VOCAB_BANK.filter(function(w) { return !wrongWordSet[w.en] && !passedWordSet[w.en]; });
  // 40% from wrong pool, 60% from fresh pool (if available)
  var fromWrong = Math.min(Math.floor(count * 0.4), wrongPool.length);
  var fromFresh = Math.min(count - fromWrong, freshPool.length);
  if (fromFresh < count - fromWrong) {
    // Not enough fresh words, take more from wrong pool
    fromWrong = Math.min(count, wrongPool.length);
    fromFresh = count - fromWrong;
  }
  // Shuffle helper
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  var selected = shuffle(shuffle(wrongPool).slice(0, fromWrong)).concat(shuffle(shuffle(freshPool).slice(0, fromFresh)));
  // If still not enough, fill from any remaining
  if (selected.length < count) {
    var used = {};
    selected.forEach(function(w) { used[w.en] = true; });
    var remaining = VOCAB_BANK.filter(function(w) { return !used[w.en]; });
    selected = selected.concat(shuffle(remaining).slice(0, count - selected.length));
  }
  return selected.slice(0, count);
}

// Generate 4 options: 1 correct + 3 random distractors
function generateOptions(correctWord) {
  var distractors = VOCAB_BANK.filter(function(w) { return w.en !== correctWord.en; });
  var shuffled = [];
  for (var i = distractors.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    shuffled.push(distractors.splice(j, 1)[0]);
  }
  shuffled.push(distractors[0]);
  var wrongOptions = shuffled.slice(0, 3).map(function(w) { return w.zh; });
  var allOptions = wrongOptions.concat([correctWord.zh]);
  // Shuffle options
  for (var i = allOptions.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = allOptions[i]; allOptions[i] = allOptions[j]; allOptions[j] = t;
  }
  return allOptions;
}

function VocabularyTraining() {
  var resp = useResponsive();
  var isTablet = resp.isTablet, contentPadding = resp.contentPadding, maxContentWidth = resp.maxContentWidth;
  var contentWidth = isTablet ? maxContentWidth : '100%';
  var dailyCountState = useState(getDailyCount()), dailyCount = dailyCountState[0], setDailyCount = dailyCountState[1];
  var showSettingsState = useState(false), showSettings = showSettingsState[0], setShowSettings = showSettingsState[1];
  var todayKey = getTodayKey();
  // Initialize today's words from progress
  var progress = getVocabProgress();
  var todayData = progress[todayKey] || { words: null, results: {}, index: 0, completed: false };
  var wordsState = useState(todayData.words || generateDailyWords(dailyCount)), words = wordsState[0], setWords = wordsState[1];
  var indexState = useState(todayData.index || 0), currentIndex = indexState[0], setCurrentIndex = indexState[1];
  var resultsState = useState(todayData.results || {}), results = resultsState[0], setResults = resultsState[1];
  var completedState = useState(todayData.completed || false), completed = completedState[0], setCompleted = completedState[1];
  var answeredState = useState(null), selectedAnswer = answeredState[0], setSelectedAnswer = answeredState[1];
  var swipeRef = useRef({ startX: 0, startY: 0, dx: 0, dy: 0 });
  var cardRef = useRef(null);

  // Persist progress
  function persist(newWords, newIndex, newResults, newCompleted) {
    var p = getVocabProgress();
    p[todayKey] = { words: newWords, results: newResults, index: newIndex, completed: newCompleted };
    saveVocabProgress(p);
  }
  persist(words, currentIndex, results, completed);

  // Speak word function
  function speakWord() {
    if (currentWord && isSpeechSupported()) {
      speakText(currentWord.en, { rate: 0.8 });
    }
  }

  // Auto-speak when word changes
  useEffect(function() {
    if (currentWord && !completed) {
      speakText(currentWord.en, { rate: 0.8 });
    }
    return function() { stopSpeaking(); };
  }, [currentIndex, completed]);

  // Stop speech on unmount
  useEffect(function() {
    return function() { stopSpeaking(); };
  }, []);

  // Stats
  var correctCount = Object.keys(results).filter(function(w) { return results[w] === 'correct'; }).length;
  var wrongCount = Object.keys(results).filter(function(w) { return results[w] === 'wrong'; }).length;
  var answeredCount = correctCount + wrongCount;
  var totalWords = words.length;
  var vocabBankTotal = VOCAB_BANK.length;
  var cumulativeSlain = getCumulativeSlainCount();
  var cumulativeAttempted = getCumulativeAttemptedCount();
  var currentWord = words[currentIndex];

  // Generate options for current word (memoized per word)
  var optionsState = useState(null), cachedOptions = optionsState[0], setCachedOptions = optionsState[1];
  var optionsForWord = useMemo(function() {
    if (!currentWord) return [];
    if (cachedOptions && cachedOptions.word === currentWord.en) return cachedOptions.options;
    var opts = generateOptions(currentWord);
    setCachedOptions({ word: currentWord.en, options: opts });
    return opts;
  }, [currentWord, cachedOptions]);

  function handleAnswer(option) {
    if (selectedAnswer !== null) return;
    setSelectedAnswer(option);
    var isCorrect = option === currentWord.zh;
    var newResults = Object.assign({}, results);
    newResults[currentWord.en] = isCorrect ? 'correct' : 'wrong';
    setResults(newResults);
    persist(words, currentIndex, newResults, false);
  }

  function handleNext() {
    if (currentIndex < totalWords - 1) {
      var newIdx = currentIndex + 1;
      setCurrentIndex(newIdx);
      setSelectedAnswer(null);
      setCachedOptions(null);
      persist(words, newIdx, results, false);
    } else {
      setCompleted(true);
      persist(words, currentIndex, results, true);
    }
  }

  function handlePrev() {
    if (currentIndex > 0) {
      var newIdx = currentIndex - 1;
      setCurrentIndex(newIdx);
      setSelectedAnswer(null);
      setCachedOptions(null);
      persist(words, newIdx, results, false);
    }
  }

  function handleRestart() {
    var newWords = generateDailyWords(dailyCount);
    setWords(newWords);
    setCurrentIndex(0);
    setResults({});
    setCompleted(false);
    setSelectedAnswer(null);
    setCachedOptions(null);
    persist(newWords, 0, {}, false);
  }

  function handleSaveSettings(newCount) {
    setDailyCount(newCount);
    try { localStorage.setItem(VOCAB_SETTINGS_KEY, String(newCount)); } catch(e) {}
    setShowSettings(false);

  // Swipe handlers — ref-only, no per-move state updates, no setTimeout, no animation
