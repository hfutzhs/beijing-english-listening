<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Whisper Pipeline Test</title></head>
<body>
<h1>Whisper Pipeline Test</h1>
<pre id="log"></pre>
<script type="module">
  const logEl = document.getElementById('log');
  function log(msg) {
    const line = `[${new Date().toISOString()}] ${msg}`;
    console.log(line);
    logEl.textContent += line + '\n';
  }

  log('Importing transformers.js...');
  try {
    const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm");
    log('Import successful');

    env.allowLocalModels = true;
    env.allowRemoteModels = false;
    env.localModelPath = new URL("./models/", document.baseURI).href;
    env.useBrowserCache = true;
    env.backends.onnx.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/";
    env.backends.onnx.wasm.numThreads = 1;
    log('Env configured: numThreads=1, proxy=false, localModelPath=' + env.localModelPath);

    const progressCb = (p) => {
      log(`Progress: ${JSON.stringify(p)}`);
    };

    log('Creating pipeline (this downloads model + inits WASM)...');
    const t0 = Date.now();

    const pipe = await Promise.race([
      pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', { quantized: true, progress_callback: progressCb }),
      new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT after 120s')), 120000))
    ]);

    log(`Pipeline created in ${Date.now() - t0}ms`);
    log('Testing inference with 2 seconds of silence (zeros)...');
    const dummyAudio = new Float32Array(32000); // 2 seconds at 16kHz
    const output = await pipe(dummyAudio);
    log(`Inference result: "${output.text}"`);
    log('SUCCESS - everything works!');
  } catch(e) {
    log(`ERROR: ${e.message || e}`);
    log(`Stack: ${e.stack || ''}`);
  }
</script>
</body>
</html>
